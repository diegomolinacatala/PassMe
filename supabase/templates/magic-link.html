<!--
  Supabase → Authentication → Emails → Templates → "Magic Link"
  (use the same body for "Confirm signup"). Subject suggestion:
    Tu acceso a PassMe: {{ .Token }}
  The link goes to /auth/confirm (token_hash), which works even if the email is
  opened on another device; the 6-digit code can be typed in the login screen.
-->
<!doctype html>
<html lang="es">
  <body style="margin:0;padding:0;background:#f3efe6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#221b17;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3efe6;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#fbf9f4;border-radius:24px;overflow:hidden;">
            <tr>
              <td style="background:#221b17;padding:28px 32px;">
                <span style="font-family:Georgia,'Times New Roman',serif;font-size:28px;color:#f3efe6;">Pass<em style="color:#f6c6a6;">Me</em></span>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <p style="margin:0 0 8px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#6a5f55;">Tu acceso</p>
                <h1 style="margin:0 0 16px;font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:32px;line-height:1.05;">Entra en PassMe</h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.5;color:#463b33;">
                  Pulsa el botón para entrar. Si prefieres, escribe este código en la pantalla de acceso:
                </p>
                <p style="margin:0 0 28px;font-family:'SFMono-Regular',Menlo,Consolas,monospace;font-size:34px;letter-spacing:10px;font-weight:600;">{{ .Token }}</p>
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/dashboard"
                   style="display:inline-block;background:#c24e1c;color:#ffffff;text-decoration:none;font-weight:600;font-size:16px;padding:14px 26px;border-radius:999px;">
                  Entrar en mi tarjeta
                </a>
                <p style="margin:28px 0 0;font-size:13px;line-height:1.5;color:#6a5f55;">
                  El enlace y el código caducan en una hora y solo sirven una vez. Si no has pedido este email, ignóralo: nadie puede entrar sin él.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
